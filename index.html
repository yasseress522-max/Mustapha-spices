<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>العطرية | متجر التوابل</title>

  <meta
    name="description"
    content="اكتشفوا منتوجات العطرية والتوابل واختاروا القسم المناسب لكم."
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =================================
       1. الألوان والخطوط العامة
    ================================= */
    :root {
      --bg: #F4F6F3;
      --text: #202923;
      --text-soft: #526057;

      --accent: #2E5E55;
      --accent-dark: #234A42;
      --accent-light: #E5EFEB;

      --card-bg: #FFFFFF;
      --border: #D6DED8;

      --radius: 16px;
      --font: 'Tajawal', Tahoma, Arial, sans-serif;
      --shadow: 0 5px 20px rgba(27, 36, 32, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 20px;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 4px solid #E0A526;
      outline-offset: 4px;
    }

    .container {
      width: min(1160px, 100%);
      margin-inline: auto;
      padding-inline: 28px;
    }

    /* =================================
       2. رأس الموقع
    ================================= */
    .site-header {
      background: var(--accent);
      color: #FFFFFF;
      padding: 18px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #FFFFFF;
      object-fit: contain;
      cursor: zoom-in;
    }

    .shop-name {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.3;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 14px;
    }

    .phone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 10px 22px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
      transition: background 0.2s;
    }

    .phone:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* =================================
       3. المحتوى الرئيسي وبطاقات الأقسام
    ================================= */
    .page {
      padding-top: 44px;
      padding-bottom: 48px;
    }

    .intro {
      margin-bottom: 34px;
    }

    .intro h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 4vw, 42px);
      font-weight: 800;
      line-height: 1.4;
    }

    .intro p {
      max-width: 760px;
      margin: 0;
      color: var(--text-soft);
      font-size: 23px;
      line-height: 1.7;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--accent);
      font-size: 19px;
      font-weight: 700;
    }

    .section-label::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
    }

    .card {
      min-width: 0;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 10px 28px rgba(27, 36, 32, 0.12);
      transform: translateY(-3px);
    }

    .card-link {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #E5EAE5;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 22px 24px 24px;
      border-top: 5px solid var(--accent);
    }

    .card h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 30px;
      font-weight: 800;
      line-height: 1.4;
    }

    .card-description {
      margin: 0;
      color: var(--text-soft);
      font-size: 20px;
      line-height: 1.7;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 60px;
      margin-top: 22px;
      padding: 12px 16px;
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 10px;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
      transition: background 0.2s;
    }

    .card-link:hover .card-action {
      background: var(--accent-dark);
    }

    .action-arrow {
      font-size: 27px;
      line-height: 1;
    }

    /* =================================
       4. قسم واتساب والتذييل
    ================================= */
    .contact-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 32px;
      padding: 18px 24px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .contact-text {
      flex: 1;
      min-width: 200px;
    }

    .contact-section h2 {
      margin: 0 0 3px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.5;
    }

    .contact-section p {
      margin: 0;
      color: var(--text-soft);
      font-size: 18px;
      line-height: 1.5;
    }

    .contact-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 50px;
      padding: 10px 22px;
      border-radius: 9px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .contact-button:hover {
      background: var(--accent-dark);
    }

    .contact-icon {
      font-size: 22px;
      line-height: 1;
    }

    .site-footer {
      background: #202923;
      color: #EEF1EE;
      text-align: center;
      padding: 22px;
      font-size: 18px;
    }

    .site-footer p {
      margin: 0;
    }

    /* =================================
       5. نافذة تكبير الصور
    ================================= */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(20, 28, 24, 0.92);
      cursor: zoom-out;
    }

    .zoom-overlay img {
      display: block;
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      background: #FFFFFF;
      border-radius: 12px;
    }

    .zoom-close {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      min-height: 54px;
      padding: 10px 22px;
      border: 0;
      border-radius: 10px;
      background: #FFFFFF;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =================================
       6. استجابة الشاشات الصغيرة وتقليل الحركة
    ================================= */
    @media (max-width: 760px) {
      .container {
        padding-inline: 18px;
      }

      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }

      .brand {
        justify-content: center;
      }

      .shop-name {
        font-size: 27px;
      }

      .header-actions {
        justify-content: center;
      }

      .phone {
        flex: 1;
      }

      .page {
        padding-top: 32px;
        padding-bottom: 36px;
      }

      .intro {
        margin-bottom: 28px;
      }

      .intro h1 {
        font-size: 32px;
      }

      .intro p {
        font-size: 21px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .card-body {
        padding: 20px;
      }

      .card h2 {
        font-size: 28px;
      }

      .card-description {
        font-size: 20px;
      }

      .card-action {
        min-height: 62px;
        font-size: 21px;
      }

      .contact-section {
        margin-top: 26px;
        padding: 16px 18px;
      }

      .contact-text {
        min-width: 100%;
      }

      .contact-section h2 {
        font-size: 21px;
      }

      .contact-section p {
        font-size: 18px;
      }

      .contact-button {
        width: 100%;
        min-height: 52px;
      }
    }

    @media (max-width: 380px) {
      .container {
        padding-inline: 14px;
      }

      .shop-name {
        font-size: 24px;
      }

      .logo {
        width: 58px;
        height: 58px;
      }

      .card h2 {
        font-size: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- رأس الموقع -->
  <header class="site-header">
    <div class="container header-inner">

      <div class="brand">
        <img
          class="logo"
          src="images/logo.png"
          alt="شعار المتجر، اضغط لتكبيره"
          data-zoom
          tabindex="0"
          role="button"
        >
        <span class="shop-name" data-shop-name></span>
      </div>

      <div class="header-actions">
        <a
          class="phone"
          data-whatsapp-link
          target="_blank"
          rel="noopener noreferrer"
        >
          تواصل معنا عبر واتساب
        </a>
      </div>

    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="container page">

    <section class="intro">
      <h1>مرحبا بكم في متجرنا</h1>
      <p>552</p>
    </section>

    <div class="section-label">أقسام المنتوجات</div>

    <!-- بطاقات الأقسام كيتولّدو تلقائياً من مصفوفة CATEGORIES -->
    <section class="cards" id="categories-container" aria-label="أقسام المتجر"></section>

    <!-- قسم التواصل عبر واتساب -->
    <section class="contact-section">
      <div class="contact-text">
        <h2>عندك سؤال على شي منتوج؟</h2>
        <p>تواصل معنا مباشرة عبر واتساب.</p>
      </div>

      <a
        class="contact-button"
        data-whatsapp-link
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>راسلنا عبر واتساب</span>
        <span class="contact-icon" aria-hidden="true">↗</span>
      </a>
    </section>

  </main>

  <!-- التذييل -->
  <footer class="site-footer">
    <p>
      <span data-shop-name></span>
      —
      <span data-shop-city></span>
    </p>
  </footer>

  <script>
    /* =====================================================
       1. معلومات المتجر الأساسية (عدّلهم هنا مرة وحدة)
    ===================================================== */
    const STORE = {
      name: "[اسم العطرية]",
      city: "[المدينة]",
      whatsappNumber: "212600000000",
      whatsappMessage: "السلام عليكم، بغيت نستفسر على المنتوجات",
      viewProductsText: "اضغط هنا لعرض المنتوجات"
    };

    const CATEGORIES = [
      {
        href: "meat.html",
        image: "images/meat.jpg",
        title: "السطولة",
        description: "606",
        ariaLabel: "عرض جميع منتوجات توابل اللحم"
      },
      {
        href: "chicken.html",
        image: "images/chicken.jpg",
        title: "",
        description: "613.",
        ariaLabel: "عرض جميع منتوجات توابل الدجاج"
      },
      {
        href: "garlic.html",
        image: "images/garlic.jpg",
        title: "الثوم المفروم",
        description: "620.",
        ariaLabel: "عرض جميع منتوجات الثوم المفروم"
      }
    ];

    /* =====================================================
       3. تعبئة البيانات وعرض الأقسام
    ===================================================== */
    function buildWhatsappUrl() {
      return `https://wa.me/${STORE.whatsappNumber}?text=${encodeURIComponent(STORE.whatsappMessage)}`;
    }

    function renderPage() {
      document.querySelectorAll("[data-shop-name]").forEach((el) => {
        el.textContent = STORE.name;
      });

      document.querySelectorAll("[data-shop-city]").forEach((el) => {
        el.textContent = STORE.city;
      });

      const waUrl = buildWhatsappUrl();
      document.querySelectorAll("[data-whatsapp-link]").forEach((link) => {
        link.href = waUrl;
      });

      const container = document.getElementById("categories-container");
      if (container) {
        container.innerHTML = CATEGORIES.map((cat) => `
          <article class="card">
            <a class="card-link" href="${cat.href}" aria-label="${cat.ariaLabel}">
              <img
                class="card-image"
                src="${cat.image}"
                alt="${cat.title}"
                loading="lazy"
              >
              <div class="card-body">
                <h2>${cat.title}</h2>
                <p class="card-description">${cat.description}</p>
                <div class="card-action">
                  <span>${STORE.viewProductsText}</span>
                  <span class="action-arrow" aria-hidden="true">←</span>
                </div>
              </div>
            </a>
          </article>
        `).join("");
      }
    }

    document.addEventListener("DOMContentLoaded", renderPage);

    /* =====================================================
       4. تكبير الصور
    ===================================================== */
    (function setupImageZoom() {
      function openImage(img) {
        const overlay = document.createElement("div");
        overlay.className = "zoom-overlay";
        overlay.setAttribute("role", "dialog");
        overlay.setAttribute("aria-modal", "true");
        overlay.setAttribute("aria-label", img.alt);

        const bigImage = document.createElement("img");
        bigImage.src = img.currentSrc || img.src;
        bigImage.alt = img.alt;

        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.className = "zoom-close";
        closeButton.textContent = "إغلاق";

        function closeImage() {
          overlay.remove();
          document.removeEventListener("keydown", handleKey);
          img.focus();
        }

        function handleKey(event) {
          if (event.key === "Escape") closeImage();
        }

        overlay.addEventListener("click", closeImage);
        closeButton.addEventListener("click", (event) => {
          event.stopPropagation();
          closeImage();
        });
        bigImage.addEventListener("click", (event) => event.stopPropagation());
        document.addEventListener("keydown", handleKey);

        overlay.appendChild(bigImage);
        overlay.appendChild(closeButton);
        document.body.appendChild(overlay);
        closeButton.focus();
      }

      document.addEventListener("click", (event) => {
        const img = event.target.closest("[data-zoom]");
        if (!img) return;
        event.preventDefault();
        openImage(img);
      });

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (!target.matches("[data-zoom]")) return;
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openImage(target);
        }
      });
    })();
  </script>

</body>
</html>
